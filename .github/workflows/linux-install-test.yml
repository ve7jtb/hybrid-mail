name: Linux installation tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/linux-install-test.yml']
  workflow_run:
    workflows: ['Linux packages']
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  install:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Select completed package run
        id: packages
        env:
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          python3 - <<'PYRUN'
          import os, urllib.request, json
          run=os.environ.get('SOURCE_RUN')
          if not run:
              url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/workflows/linux-packages.yml/runs?branch=main&status=success&per_page=1'
              run=str(json.load(urllib.request.urlopen(url))['workflow_runs'][0]['id'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('run_id='+run+'\n')
          print('Testing package run '+run)
          PYRUN
      - uses: actions/download-artifact@v8.0.2
        with:
          name: PQ-Mail-Linux-${{ matrix.arch }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.packages.outputs.run_id }}
      - name: Verify artifacts and install Debian package
        run: |
          sha256sum --check SHA256SUMS
          # Minimal CI images have no desktop menu; provision the desktop fixture.
          sudo mkdir -p /usr/share/desktop-directories
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils ./PQ-Mail-1.2.1-Linux-${{ matrix.arch }}.deb
          dpkg-query -W pq-mail
      - name: Launch installed desktop app with disposable settings
        run: |
          xvfb-run -a python3 - <<'PY'
          import os, pathlib, subprocess, tempfile, time
          files=subprocess.check_output(['dpkg','-L','pq-mail'],text=True).splitlines()
          launcher=next(p for p in files if p.endswith('/bin/PQ Mail'))
          with tempfile.TemporaryDirectory() as settings, open('desktop-startup.log','w+') as log:
              env=dict(os.environ, JAVA_TOOL_OPTIONS='-Dhybridmail.dataDir='+settings)
              proc=subprocess.Popen([launcher],env=env,stdout=log,stderr=log)
              try:
                  for attempt in range(60):
                      if proc.poll() is not None: raise RuntimeError('Desktop app exited during startup')
                      tree=subprocess.check_output(['xwininfo','-root','-tree'],text=True)
                      if '"PQ Mail' in tree:
                          print('PASS installed PQ Mail desktop window opened; no accounts, email or hardware')
                          break
                      time.sleep(.5)
                  else: raise RuntimeError('PQ Mail window did not appear')
              finally:
                  proc.terminate()
                  try: proc.wait(timeout=10)
                  except subprocess.TimeoutExpired: proc.kill();proc.wait()
                  log.seek(0);print(log.read())
          PY
