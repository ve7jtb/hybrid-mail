name: Linux packages
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/on-key-certificates]
    paths: ['src/**', 'adapters/**', 'native-src/**', 'patches/**', 'scripts/**', 'assets/**', 'build.sh', '.github/workflows/linux-packages.yml']
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            java: x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            java: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: zulu
          # setup-java encoding for JDK 25.0.5.1+2.
          java-version: '25.0.5+1.2'
          architecture: ${{ matrix.java }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config meson ninja-build libpcsclite-dev libudev-dev pcscd libccid libsecret-1-dev gnome-keyring dbus-x11 patchelf fakeroot libgtk-3-0t64 libasound2t64 libxtst6 libxrender1 libxi6 libfontconfig1 xdg-utils xvfb
      - run: bash scripts/build-dependencies.sh
      - run: bash build.sh test
        env:
          PQ_MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.PQ_MAIL_GOOGLE_CLIENT_SECRET }}
      - name: Native passkey PIN dialog and modal ownership
        run: xvfb-run -a java -cp 'build/hybrid-mail.jar:lib/*' dev.hybridmail.LinuxPasskeyUiTest
      - run: bash scripts/build-linux-native.sh
      - name: Disposable Secret Service test
        run: dbus-run-session -- bash scripts/test-linux-credentials.sh
      - name: Package and test bundled runtime
        run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: PQ-Mail-Linux-${{ matrix.arch }}
          path: dist/linux/*
          if-no-files-found: error
